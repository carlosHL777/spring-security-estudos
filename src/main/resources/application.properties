spring.application.name=spring-security-estudo

spring.datasource.url=jdbc:postgresql://localhost:5432/s-security-estudos
spring.datasource.username=postgres
spring.datasource.password=manager
spring.datasource.driver-class-name=org.postgresql.Driver # Spring Boot can infer this from the URL

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enable=true